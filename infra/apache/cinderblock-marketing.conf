# Cinderblock — marketing + docs vhost.
# DocumentRoot at /, both apex and app subdomain proxy to the same PM2 process
# on 127.0.0.1:3015. Next.js middleware switches the layout by Host header.
#
# After dropping this file in /etc/apache2/sites-available/:
#   sudo a2ensite cinderblock-marketing
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#   sudo certbot --apache \
#     -d cinderblock.philiprehberger.com \
#     -d app.cinderblock.philiprehberger.com

<VirtualHost *:80>
    ServerName cinderblock.philiprehberger.com
    ServerAlias app.cinderblock.philiprehberger.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:3015/
    ProxyPassReverse / http://127.0.0.1:3015/

    # Tell the backend what the original public-facing URL looked like.
    # Without these, Next.js's request.url resolves to the standalone
    # server's bind address (0.0.0.0:3015) and redirects can land on the
    # internal URL. The route handlers prefer NEXT_PUBLIC_SITE_URL but
    # these are the belt-and-suspenders backstop.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host "%{Host}i"
    # The matching -le-ssl.conf on the host has the same lines but with
    # X-Forwarded-Proto set to "https" (that's the vhost actual users hit).

    # Long timeouts for Server-Sent Events in case future surfaces use them.
    ProxyTimeout 600

    ErrorLog ${APACHE_LOG_DIR}/cinderblock-error.log
    CustomLog ${APACHE_LOG_DIR}/cinderblock-access.log combined
</VirtualHost>

# After certbot runs, it generates the matching -le-ssl.conf and adds a
# RewriteRule redirect from port 80 to 443. Don't edit this file manually
# to add the SSL block — certbot's tracking will get out of sync.
